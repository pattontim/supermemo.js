<!DOCTYPE HTML>
<!-- To interface with SuperMemo you must preserve these properties and fields when editing yt_new.htm:
    - the order of INPUT fields (these are used by SuperMemo to collect extract boundaries)
    - SELECT and OPTION fields for generating extracts
    - INPUT field with YouTube video ID substituted by SuperMemo (id="videoid")
    - INPUT field that determines the position of video start and end (id="startvideoat" and id="stopvideoat")(must be "0:00:00")
    see: https://help.supermemo.org/wiki/Incremental_video#Your_own_incremental_video_script
    Symptoms of failure to do this: 
         - extract start nd stop times are rotated incorrctly (start becomes stop)
         - random elements with name of input element value are added as extracts
    Undocumented restraints:
    - OPTION elements anywhere on the page make extracts...
-->
<html>
  <head>
    <!-- <title>SuperMemo YouTube Demo</title> -->
    <!-- <meta http-equiv="content-type" content="text/html; charset=windows-1252"> -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
    <!-- <meta content="IE=11.0000" http-equiv="X-UA-Compatible"> -->
    <link rel="stylesheet" href="/css/extractboard.css">
  </head>
  <body>
    <div id="root">
      <!-- DO NOT DELETE
        <input type="hidden" value="0" id="customPromptVisible" />

        SM NEEDS customPromptVisible or disables the Learn button
        It is an artifact of the original code, where YUI library was used to 
        display a dialog box and register ENTER keypresses. This switch was used
        to prevent the Learn button from being clicked when the dialog box was
        visible. SM does searches for this as a raw string
      -->
    </div>

    <script>
      // Dual-Target Bundle Loader for SM18 (IE11) and SM20 (WebView2)
      // Automatically detects browser and loads the appropriate bundle
      
      (function() {
        // Detect target from URL parameter first (from server-side routing)
        // const params = new URLSearchParams(window.location.search);
        // IE11 supported...
        // const params = window.location.search + '&target=ie11';
        // let target = params.get('target') || 'ie11';
        // let target = window.location.search.includes('target=webview2') ? 'webview2' : 'ie11';
        let target = "ie11";
        
        // Override with browser detection if available
        if (window.MSInputMethodContext && document.documentMode) {
          // IE11 detected
          target = 'ie11';
          console.log('[Loader] IE11 detected (window.documentMode)');
        } else if (window.chrome && window.chrome.webview) {
          // WebView2 detected
          target = 'webview2';
          console.log('[Loader] WebView2 detected (window.chrome.webview)');
        } else {
          // Modern browser - default to IE11 for SM18 compatibility in dev
          target = 'ie11';
          console.log('[Loader] Modern browser detected, defaulting to ie11');
        }
        
        console.log('[Loader] Loading bundle for target:', target, 'from:', location.href);
        
        // Inject global vars for bundle
        window.BUILD_TARGET = target;
        window.BUNDLE_MODE = 'http';
        
        // Load the appropriate bundle based on target
        const bundleUrl = '/' + target + '/smplayer.bundle.js';
        const script = document.createElement('script');
        script.src = bundleUrl;
        script.type = 'text/javascript';
        script.async = true;
        
        script.onerror = function() {
          console.error('[Loader] Error loading bundle:', bundleUrl);
          console.error('[Loader] Check that webpack builds were run for target:', target);
          console.error('[Loader] Available bundles: /ie11/smplayer.bundle.js, /webview2/smplayer.bundle.js');
        //   document.getElementById('root').innerHTML = 
        //   `
        //     <div style="padding: 20px; font-family: monospace; color: red;">
        //       Error: Failed to load bundle from ${bundleUrl}<br>
        //       <br>
        //       Target: ${target}<br>
        //       Browser: ${navigator.userAgent.substring(0, 50)}...<br>
        //       <br>
        //       <small>Check console for more details</small>
        //     </div>
        //   `;
        // };
        };
        
        script.onload = function() {
          console.log('[Loader] Bundle loaded successfully');
        };
        
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
